name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Trouver le projet
        run: |
          DIR=$(dirname "$(find . -name settings.gradle -not -path '*/node_modules/*' | head -1)")
          echo "Projet trouvé dans : $DIR"
          ls -la "$DIR"
          echo "PROJ=$DIR" >> $GITHUB_ENV

      - name: Compiler l'APK
        run: |
          cd "$PROJ"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/waf-signage.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: waf-signage-apk
          path: waf-signage.apk

      - name: Publier (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: WAF Signage 2.0.${{ github.run_number }}
          files: waf-signage.apk
          make_latest: true
